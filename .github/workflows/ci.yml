name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Quality, unit tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - name: Install dependencies
        run: HUSKY=0 bun install --frozen-lockfile
      - name: Run checks
        run: bun run check
      - name: Run production smoke test
        run: bun run test:production

  browser:
    name: Browser E2E and offline suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - name: Install dependencies
        run: HUSKY=0 bun install --frozen-lockfile
      - name: Install Poppler utilities
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build production bundle
        run: bun run build
      - name: Run E2E tests
        run: bun run test:e2e
      - name: Run offline suite
        run: bun run test:offline
